const compressImg=(dataUrl,maxW,quality)=>{maxW=maxW||640;quality=quality||0.5;return new Promise(resolve=>{const img=new Image();img.onload=()=>{const cvs=document.createElement('canvas');let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}cvs.width=w;cvs.height=h;cvs.getContext('2d').drawImage(img,0,0,w,h);resolve(cvs.toDataURL('image/jpeg',quality));};img.onerror=()=>resolve(dataUrl);img.src=dataUrl;});};

const fetchMonthlyFS=async(uid,ref)=>{const y=ref.getFullYear(),m=ref.getMonth(),nw=new Date();const startD=y+'-'+_p(m+1)+'-01';const dim=new Date(y,m+1,0).getDate();const endD=y+'-'+_p(m+1)+'-'+_p(dim);const todayS=dk(nw);const lastD=endD>todayS?todayS:endD;try{const snap=await db.collection('entries').doc(uid).collection('days').where(firebase.firestore.FieldPath.documentId(),'>=',startD).where(firebase.firestore.FieldPath.documentId(),'<=',lastD).get();let tA=0,tD=0,days=0,dd=[];snap.forEach(doc=>{const acts=doc.data().activities||[];const dn2=acts.filter(a=>a.executed).length;tA+=acts.length;tD+=dn2;days++;const ps=doc.id.split('-');const dt2=new Date(+ps[0],+ps[1]-1,+ps[2]);dd.push({date:dt2,total:acts.length,done:dn2,pct:acts.length>0?Math.round(dn2/acts.length*100):0});});dd.sort((a,b)=>a.date-b.date);return{tA,tD,days,pct:tA>0?Math.round(tD/tA*100):0,dd};}catch(e){console.error('fetchMonthlyFS:',e);return{tA:0,tD:0,days:0,pct:0,dd:[]};}};
